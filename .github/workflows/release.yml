name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm run check:data && npm run validate && npm run typecheck && npm test
      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
          grep -q "^version = \"${GITHUB_REF_NAME#v}\"" pyproject.toml
      - name: Build release artifacts
        run: |
          python -m pip install genanki build
          python scripts/build_exports.py release
          npm run build:pkg
          npm pack --pack-destination release
          python -m build --outdir release
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.sha }}
          path: release
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
          body: |
            Independently maintained Kotowa · 词和 release, derived from OpenJLPT.
            Includes Chinese learning data, Anki decks, Yomitan, JavaScript tarball and Python distributions.
            See CHANGELOG.md and NOTICE.md for changes, compatibility and attribution.
