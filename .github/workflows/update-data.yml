name: Update data
# Manual review only: never merge refreshed data or upstream code automatically.
on:
  workflow_dispatch: {}
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build && npm run check:data && npm test && npm run audit:data
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: data-refresh-${{ github.sha }}
          path: data
          retention-days: 14
      - uses: peter-evans/create-pull-request@v8
        id: pr
        with:
          commit-message: 'chore(data): stage reviewed upstream refresh'
          title: 'Review upstream data refresh'
          body: |
            Inspect guarded corrections, source changes and stale Chinese translations.
            Re-review changed content and pass CI before merging. No automatic merge.
          branch: data/review-refresh
          delete-branch: true
          add-paths: |
            data
            sources
            README.md
            README.ja.md
      - name: Run CI on the refresh PR
        if: steps.pr.outputs.pull-request-number != ''
        run: gh workflow run ci.yml --ref data/review-refresh
        env:
          GH_TOKEN: ${{ github.token }}
